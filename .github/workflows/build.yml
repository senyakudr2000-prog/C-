name: Build mod

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack zip
        id: unpack
        run: |
          set -e
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then echo "No .zip in repo root"; exit 1; fi
          echo "Using $ZIP"
          mkdir -p _mod
          unzip -q -o "$ZIP" -d _mod
          GRADLE_FILE=$(find _mod -maxdepth 3 -name build.gradle | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then echo "build.gradle not found in zip"; exit 1; fi
          echo "dir=$(dirname "$GRADLE_FILE")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build jar
        working-directory: ${{ steps.unpack.outputs.dir }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: ${{ steps.unpack.outputs.dir }}/build/libs/*.jar

      - name: Publish release (easy download on phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: ${{ steps.unpack.outputs.dir }}/build/libs/*.jar
