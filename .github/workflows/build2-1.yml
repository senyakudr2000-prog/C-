name: Булд умл2

on:
  push:
    paths:
      - 'postapo-mod.zip'
      - '.github/workflows/build2.yml'
  workflow_dispatch:

jobs:
  Булд умл2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          rm -rf project
          mkdir project
          unzip -q postapo-mod.zip -d project
          echo "Содержимое проекта:"
          ls -la project

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build jar
        working-directory: project
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: postapo-jar
          path: project/build/libs/*.jar
          if-no-files-found: error
